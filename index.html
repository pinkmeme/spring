@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111113}}
:root[data-theme="dark"]{--bg:#111113}
html,body{height:100%;margin:0}
body{background:#000;overflow:hidden;font-family:-apple-system,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
#stage{position:absolute;left:50%;top:50%;transform-origin:center}
.phone{position:relative;width:393px;height:852px;border-radius:56px;overflow:hidden;background:#000;box-shadow:0 0 0 3px #5a5a5e,0 0 0 13px #2b2b2e,0 40px 90px rgba(0,0,0,.45)}
.island{position:absolute;top:11px;left:50%;width:122px;height:35px;margin-left:-61px;background:#000;border-radius:20px;z-index:60}
.sb{position:absolute;top:0;left:0;right:0;height:54px;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:6px 34px 0 46px;font-weight:600;font-size:16px;color:#000;pointer-events:none}
.sb .r{display:flex;gap:6px;align-items:center;font-size:13px}
.bat{width:25px;height:12px;border:1.5px solid currentColor;border-radius:4px;position:relative;opacity:.9}
.bat::after{content:"";position:absolute;inset:1.5px;right:5px;background:currentColor;border-radius:1px}
.phone.lt .sb{color:#fff}
.hb{position:absolute;bottom:8px;left:50%;width:140px;height:5px;margin-left:-70px;border-radius:3px;background:#000;z-index:55;cursor:pointer;opacity:.85}
.phone.lt .hb{background:#fff}
.hbz{position:absolute;bottom:0;left:0;right:0;height:26px;z-index:54;cursor:pointer}
.app{position:absolute;inset:0;display:none;flex-direction:column;background:#fff}
.app.on{display:flex}
/* lock + home */
#lock{background:var(--wp) center/cover;color:#fff;align-items:center;cursor:pointer}
#lock .d{margin-top:96px;font-size:20px;font-weight:500;opacity:.9}
#lock .t{font-size:92px;font-weight:600;letter-spacing:-2px;line-height:1.05}
#lock .h{margin-top:auto;margin-bottom:60px;font-size:15px;opacity:.8}
.pc{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;background:rgba(8,12,28,.45);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);cursor:default;z-index:5}
.pc.on{display:flex}
.pc h2{margin:160px 0 22px;font-size:20px;font-weight:500}
.pdots{display:flex;gap:18px;height:14px}
.pdots i{width:13px;height:13px;border-radius:50%;border:1.5px solid #fff}
.pdots i.f{background:#fff}
.pdots.shake{animation:sk .4s}
@keyframes sk{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pk{display:grid;grid-template-columns:repeat(3,80px);gap:16px 22px;margin-top:56px}
.pk button{width:80px;height:80px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:32px;font-family:inherit;cursor:pointer}
.pk button:active{background:rgba(255,255,255,.45)}
.pk .bk{background:none;font-size:26px}
.pc .cancel{margin-top:auto;margin-bottom:60px;color:#fff;background:none;border:0;font-size:16px;cursor:pointer;align-self:flex-end;margin-right:50px;font-family:inherit}
#home{background:var(--wp) center/cover;color:#fff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 0;padding:22px 18px 0;justify-items:center}
.ic{width:62px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;cursor:pointer;border:0;background:none;color:#fff;font-family:inherit}
.ic i{width:62px;height:62px;border-radius:14px;display:grid;place-items:center;font-style:normal;font-size:30px;filter:drop-shadow(0 2px 5px rgba(120,30,70,.25))}
.dock{margin:auto 14px 24px;padding:14px 16px;border-radius:34px;background:rgba(255,255,255,.25);backdrop-filter:blur(20px);display:flex;justify-content:space-around}
.dock .ic{font-size:0}
.wg{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:62px 18px 0}
.w{border-radius:22px;background:rgba(255,255,255,.85);color:#222;padding:12px;overflow:hidden;box-shadow:0 2px 10px rgba(120,30,70,.15);min-width:0}
.w.wide{grid-column:1/3}.w.note{background:rgba(255,249,205,.95)}
.w h4{margin:0 0 6px;font-size:13px;color:#ee4f8e}
.cal{display:grid;grid-template-columns:repeat(7,1fr);font-size:9.5px;text-align:center}
.cal b{color:#999;font-weight:500}.cal span,.cal b{line-height:16px;height:16px}.cal .t{background:#ee4f8e;color:#fff;border-radius:50%;font-weight:700}
.wx{background:linear-gradient(180deg,#1f3a7a,#2c58b0 70%,#3a6cc4);color:#fff;display:flex;flex-direction:column;padding:12px 14px;height:150px;box-sizing:border-box}
.wx .a{display:flex;justify-content:space-between;align-items:flex-start}
.wx .tp{font-size:28px;font-weight:600;line-height:1}
.wx .lc{margin-top:6px;font-size:11px;opacity:.85}
.wx .ic2{font-size:24px}
.wx .b{margin-top:auto;text-align:right}
.wx .dt{font-size:11px;opacity:.85}
.wx .tm{font-size:28px;font-weight:600;line-height:1.1;letter-spacing:-.5px}
.mrow{display:flex;gap:8px;align-items:center}.mi{min-width:0}.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.art{width:46px;height:46px;border-radius:10px;flex:none}

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const ph=$('#ph');
const clock=()=>{const d=new Date();return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')};
const ap=()=>{const d=new Date(),h=d.getHours();return (h<12?'오전 ':'오후 ')+((h%12)||12)+':'+String(d.getMinutes()).padStart(2,'0')};
function tick(){$('#clk').textContent=$('#lt').textContent=clock();
  const wd=$('#wxd');if(wd){const n=new Date(),h=n.getHours();wd.textContent=n.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'});$('#wxt').textContent=clock();$('#wxi').textContent=(h>=6&&h<18)?'☀️':'🌙'}
  $('#ld').textContent=CONFIG.lockDate||new Date().toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'})}
tick();setInterval(tick,15000);

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1600)}
let lastApp=null,noteVisits=0;
const visited=new Set();
function open(id){$$('.app').forEach(a=>a.classList.toggle('on',a.id===id));
  ph.classList.toggle('lt',id==='lock'||id==='home'||id==='call'||id==='alarm');
  visited.add(id);
  if(!['home','lock','call'].includes(id)){noteVisits=id==='noteapp'?(lastApp==='noteapp'?noteVisits+1:1):0;lastApp=id}
  if(id==='noteapp')maybeLive();else liveStop()}
const goHome=()=>{ if($('#lock').classList.contains('on'))return; endCall(true); open('home')};
$('#hb').onclick=$('#hbz').onclick=goHome;
/* 암호 입력 */
const pc=document.createElement('div');pc.className='pc';
pc.innerHTML=`<h2 id="pt">암호 입력</h2><div class="pdots" id="pdots"><i></i><i></i><i></i><i></i></div><div class="pk">${'123456789'.split('').map(k=>`<button data-k="${k}">${k}</button>`).join('')}<span></span><button data-k="0">0</button><button class="bk" data-k="bk" aria-label="지우기">⌫</button></div><button class="cancel" data-k="cancel">취소</button>`;
$('#lock').appendChild(pc);
let pin='';
const draw=()=>$$('#pdots i').forEach((d,i)=>d.classList.toggle('f',i<pin.length));
pc.onclick=e=>{e.stopPropagation();const b=e.target.closest('button');if(!b)return;const k=b.dataset.k;
  if(k==='cancel'){pc.classList.remove('on');pin='';draw();$('#pt').textContent='암호 입력';return}
  if(pin.length>=4)return;
  $('#pt').textContent='암호 입력';
  if(k==='bk')pin=pin.slice(0,-1);else pin+=k;
  draw();
  if(pin.length===4){
    if(pin===CONFIG.passcode){setTimeout(()=>{pc.classList.remove('on');pin='';draw();open('home')},200)}
    else{const d=$('#pdots');$('#pt').textContent='암호가 틀렸어요. 다시 입력하세요';d.classList.add('shake');setTimeout(()=>{d.classList.remove('shake');pin='';draw()},450)}
  }};
$('#lock').onclick=()=>pc.classList.add('on');

/* 전화 앱 */
function fmt(n){return n.replace(/^(\d{3})(\d{3,4})(\d{4})$/,'$1-$2-$3')}
let dial='';
const keys=['1','2','3','4','5','6','7','8','9','*','0','#'];
const KL={'2':'ABC','3':'DEF','4':'GHI','5':'JKL','6':'MNO','7':'PQRS','8':'TUV','9':'WXYZ','0':'+'};
$('#keys').innerHTML=keys.map(k=>`<button data-k="${k}"><b>${k}</b><i>${KL[k]||''}</i></button>`).join('')+`<span></span><button class="go" data-k="go" aria-label="전화 걸기"><svg width="38" height="38" viewBox="0 0 24 24" fill="#fff"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg></button><button class="bk" data-k="bk" aria-label="지우기">⌫</button>`;
const showNum=()=>{$('#num').textContent=fmt(dial);const bk=$('#keys .bk');if(bk)bk.style.visibility=dial?'visible':'hidden'};
$$('#keys button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;
  if(k==='bk')dial=dial.slice(0,-1);
  else if(k==='go'){const c=CONFIG.contacts.find(c=>c.phone===dial);
    if(c)startCall(c);else toast(dial?'연결할 수 없는 번호예요':'번호를 입력하세요');return}
  else if(dial.length<11)dial+=k;
  showNum()});

function startCall(c){open('call');$('#cw').textContent=c.name;$('#cs').textContent='발신 중…';$('#csub').textContent='';
  let i=0,sec=0;clearInterval(ct);
  setTimeout(()=>{if(!$('#call').classList.contains('on'))return;
    const show=()=>{$('#csub').textContent='“'+c.lines[i]+'”'};
    $('#cs').textContent='00:00';show();
    ct=setInterval(()=>{sec+=0.5;
      if(sec%1===0){const s=Math.floor(sec);$('#cs').textContent='00:'+String(s).padStart(2,'0')}

        if(i<c.lines.length)show();else{clearInterval(ct);$('#cs').textContent='통화 종료';setTimeout(()=>endCall(false),1400)}}},500)},1800);

const phdr=(t,plus)=>`<div class="ahd"><button class="rbtn pbk" aria-label="뒤로">‹</button>${t}${plus?'<button class="rbtn rt" id="pplus" aria-label="새 연락처">+</button>':''}</div>`;

function seededRnd(seed){return()=>{seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296}}
const CI=n=>CONFIG.contacts.findIndex(c=>c.name===n);
function makeRecents(){
  const R=CONFIG.recents,rnd=seededRnd(715),out=[],Y=R.year;
  const ei=CI('남예준'),mi=CI('엄마'),di=CI('아빠'),ti=CI('3학년 담임쌤');
  const digits=n=>{let x='';for(let i=0;i<n;i++)x+=Math.floor(rnd()*10);return x};
  const spamNum=()=>{const pre=rnd()<.6?'050':'070';return pre+digits(pre==='050'?9:8)};
  const mobNum=()=>{let n;do{n='010'+digits(8)}while(CONFIG.contacts.some(c=>c.phone===n));return n};
  const jan=new Date(Y,0,6),ye0=new Date(Y,3,1),ye1=new Date(Y,9,1);
  const add=(who,label,type,n)=>out.push({who,label,type,n:n||1});
  let first=true;
  for(let d=new Date(jan);d.getFullYear()===Y;d.setDate(d.getDate()+1)){
    const label=`${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}.`,mo=d.getMonth()+1,mixed=mo>=4&&mo<=7;
    if(first){add(mi,label,'in');first=false}            // 가장 오래된 통화 기록은 엄마
    if(mo>=4){
      const t=Math.min(1,(d-ye0)/(ye1-ye0)),p=mo>=10?1:0.15+0.8*Math.pow(t,1.5);   // 4월부터 시작, 점점 늘어남
      if(rnd()<p){
        add(ei,label,mixed&&rnd()<.4?'in':'out',mo>=10&&rnd()<R.twice?2:1);
        if(mixed&&rnd()<.22)add(ei,label,'missed');
      }
    }
    if(mixed&&rnd()<.17){const r=rnd();add(ti,label,r<.2?'missed':r<.8?'in':'out')}
    if(rnd()<.035)add(mi,label,rnd()<.5?'in':'out');
    if(rnd()<.02)add(di,label,rnd()<.5?'in':'out');
    if(rnd()<R.spam)out.push({who:null,num:spamNum(),label,type:'missed',n:1});

  }

function autoReply(t,text){
  const cfg=t.ia,k=text.replace(/\s/g,'').toLowerCase();
  const r=cfg.rules.find(r=>r.keys.some(w=>k.includes(w.replace(/\s/g,'').toLowerCase())));
  const out=[].concat(r?r.reply:cfg.fallback);let i=0;
  const next=()=>{
    const box=$('#smmsgs'),show=cur===t;let d=null;
    if(show){d=document.createElement('div');d.className='m';d.innerHTML='<div class="bb"><span class="dots"><span></span><span></span><span></span></span></div>';box.appendChild(d);box.scrollTop=1e5}
    setTimeout(()=>{if(d)d.remove();t.msgs.push({me:false,t:out[i++],at:new Date()});if(cur===t)renderMsgs();if(i<out.length)setTimeout(next,500)},900+Math.random()*500)};
  setTimeout(next,500);
}
function smAuto(){const e=$('#smin');e.style.height='auto';e.style.height=Math.min(e.scrollHeight+2,132)+'px'}
$('#smin').oninput=()=>{if(cur)cur.draft=$('#smin').value;smAuto()};
function sendMsg(){const v=$('#smin').value.trim();if(!v||!cur)return;$('#smin').value='';cur.draft='';smAuto();const mm={me:true,t:v,at:new Date()};cur.msgs.push(mm);renderMsgs();if(cur.ia)autoReply(cur,v);if(v===CONFIG.liveNote.draft){const t0=cur;setTimeout(()=>{mm.read=true;mm.readAt=new Date();if(cur===t0)renderMsgs()},CONFIG.liveNote.readAfter||3000)}}
$('#smsend').onclick=sendMsg;$('#smin').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendMsg()}};
drawSmsList();


/* 실시간 메모 (모든 앱을 둘러본 뒤 메모 앱을 열면 한 번 재생) */
const LN=CONFIG.liveNote;let lnState='idle',lnTimer=null,lnBuf='',lnQ=[];
function lnRender(done){
  const lines=lnBuf.split('\n');
  $('#nbody').innerHTML=lines.map((l,i)=>`<div class="nln">${esc(l)}${(!done&&i===lines.length-1)?'<span class="caret"></span>':''}</div>`).join('');
}
function hangulSeq(base,str){
  const seq=[];
  for(const ch of str){
    const c=ch.charCodeAt(0);
    if(c>=0xAC00&&c<=0xD7A3){
      const code=c-0xAC00,cho=Math.floor(code/588),jung=Math.floor((code%588)/28),jong=code%28;
      seq.push(base+CHO[cho]);
      seq.push(base+String.fromCharCode(0xAC00+cho*588+jung*28));
      if(jong)seq.push(base+ch);
    }else seq.push(base+ch);
    base+=ch;
  }
  return seq;
}
function maybeLive(){
  if(lnState!=='idle'||noteVisits<LN.visits)return;
  lnState='run';lnBuf='';lnQ=LN.script.slice();
  CONFIG.notes=CONFIG.notes.filter(n=>!n.live);drawNotes($('#nsq').value);   // 다시 시작하면 이전에 저장된 결과는 지우고 처음부터
  $('#ndate').textContent='';   // 연출 중에는 날짜·시간 숨김
  NA.classList.add('det');lnRender();
  lnTimer=setTimeout(lnStep,600);
}
function lnStep(){
  if(lnState!=='run')return;
  const op=lnQ.shift();
  if(!op){lnFinish(true);return}
  if(op.wait!=null){lnTimer=setTimeout(lnStep,op.wait);return}
  const sp=op.speed||140;
  if(op.type!=null){
    const seq=hangulSeq(lnBuf,op.type);let i=0;
    const tick=()=>{if(lnState!=='run')return;lnBuf=seq[i++];lnRender();
      lnTimer=setTimeout(i<seq.length?tick:lnStep,Math.max(25,sp/2.2)*(.7+Math.random()*.6))};
    tick();return;
  }
  if(op.erase!=null){
    let n=op.erase==='all'?[...lnBuf].length:op.erase;
    const tick=()=>{if(lnState!=='run')return;
      if(n<=0||!lnBuf){lnTimer=setTimeout(lnStep,sp);return}
      const a=[...lnBuf];a.pop();lnBuf=a.join('');n--;lnRender();lnTimer=setTimeout(tick,sp)};
    tick();
  }
}
function lnFinish(auto){
  clearTimeout(lnTimer);
  lnBuf=LN.title+'\n'+LN.body;$('#ndate').textContent='';lnRender(true);
  CONFIG.notes=CONFIG.notes.filter(n=>!n.live);
  CONFIG.notes.push({live:true,title:LN.title,body:LN.body,at:LN.at,sec:LN.section,short:LN.short,ago:-1});
  drawNotes($('#nsq').value);
  if(!auto){lnState='idle';noteVisits=0;lastApp=null;return}   // 도중에 나가면 최종 내용만 남기고, 홈에 다녀와서 연속 2번 들어오면 처음부터 다시 재생
  lnState='done';
  const t=TH.find(x=>x.name==='남예준');if(t)t.draft=LN.draft;
  open('home');                                                   // 끝나면 홈 화면으로 자동 이동
  setTimeout(()=>{if($('#home').classList.contains('on')){open('sms');SMS.classList.remove('open');setTimeout(()=>{if($('#sms').classList.contains('on'))openThread(t)},LN.afterList)}},LN.afterHome);   // 3초 뒤 남예준 문자창으로 자동 이동
}
function liveStop(){if(lnState==='run')lnFinish(false)}

/* 화면 크기에 맞춰 폰 크기 조절 */
function fit(){const s=Math.min(innerWidth/(393+40),innerHeight/(852+40),1.25);
  $('#stage').style.transform=`translate(-50%,-50%) scale(${s})`}
fit();addEventListener('resize',fit);
</script>
